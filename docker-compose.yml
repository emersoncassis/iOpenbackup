name: iopenbackup

services:
  # ==========================================
  # 0. iOpDash - Módulo Orquestrador & Painel Central
  # ==========================================
  iopdash:
    container_name: iopdash
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    pull_policy: if_not_present
    ports:
      - "${HOST_PORT:-8008}:8000"
    environment:
      - PORT=8000
      - HOST_PORT=${HOST_PORT:-8008}
      - TZ=America/Sao_Paulo
      - ICLOUD_HOST=icloud
      - ICLOUD_PORT=8080
      - CONFIG_FILE_PATH=/config/config.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dashboard:/app/dashboard
      - iopdash_data:/app/dashboard/data
      - ./config:/config
    depends_on:
      - icloud
      - samba

  # ==========================================
  # 1. iCloud Client (mandarons/icloud-docker)
  # Porta interna: acessível via proxy autenticado do iOpDash
  # ==========================================
  icloud:
    image: mandarons/icloud-drive:latest
    container_name: icloud
    restart: unless-stopped
    pull_policy: if_not_present
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - ENV_CONFIG_FILE_PATH=/config/config.yaml
    volumes:
      - ./config:/config
      - icloud_data:/icloud
    ports:
      - "127.0.0.1:8080:8080"

  # ==========================================
  # 2. Immich - Photos & Gallery (Modo Leve por Padrão)
  # Visualização simples de fotos, álbuns e linha do tempo
  # ==========================================
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:release
    pull_policy: if_not_present
    environment:
      - TZ=America/Sao_Paulo
      - DB_HOSTNAME=immich_postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich_redis
      - IMMICH_MACHINE_LEARNING_URL=http://immich-machine-learning:3003
    volumes:
      - immich_data:/data
      - icloud_data:/mnt/icloud:ro
    ports:
      - "2283:2283"
    depends_on:
      - immich-redis
      - immich-postgres
    restart: always

  # ==========================================
  # 2.1 Módulo Avançado de IA (Machine Learning - Sob Demanda)
  # Reconhecimento facial, CLIP e busca inteligente
  # Só deve ser iniciado se o hardware suportar (>= 4GB RAM)
  # e se o usuário solicitar explicitamente no iOpDash
  # ==========================================
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:release
    pull_policy: if_not_present
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - immich_model_cache:/cache
    restart: always
    profiles:
      - ml
      - immich-ml

  immich-redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-alpine
    pull_policy: if_not_present
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  immich-postgres:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    pull_policy: if_not_present
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - immich_postgres_data:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always

  # ==========================================
  # 3. Samba SMB Service (iPhone Files App Access)
  # ==========================================
  samba:
    container_name: samba
    build:
      context: ./samba
    restart: unless-stopped
    environment:
      USER: "backupuser"
      PASS: "backup123"
      NAME: "iCloud-Backup"
      RW: "true"
    volumes:
      - icloud_data:/shared
      - iopdash_data:/data:ro
    ports:
      - "4445:445"

volumes:
  iopdash_data:
    name: iopdash_data
  icloud_data:
    name: icloud_data
  immich_data:
    name: immich_data
  immich_model_cache:
    name: immich_model_cache
  immich_postgres_data:
    name: immich_postgres_data

