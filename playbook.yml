---
# ==============================================================================
#  iOpenbackup - Ansible Playbook
#  Automação de Provisionamento em VPS (Hostinger, Hetzner, AWS, etc.)
#  Uso: ansible-playbook -i "seu_ip," playbook.yml -u root
# ==============================================================================

- name: Deploy iOpenbackup Unified Stack
  hosts: all
  become: true
  vars:
    app_dir: "/opt/iopenbackup"
    dashboard_port: 8000

  tasks:
    - name: Atualizar repositórios de pacotes
      ansible.builtin.package:
        update_cache: true

    - name: Instalar dependências essenciais (git, curl)
      ansible.builtin.package:
        name:
          - git
          - curl
        state: present

    - name: Instalar Docker e Docker Compose plugin
      ansible.builtin.shell: |
        if ! command -v docker &> /dev/null; then
          curl -fsSL https://get.docker.com | sh
        fi
      args:
        creates: /usr/bin/docker

    - name: Garantir que o serviço Docker está em execução e habilitado
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Instalar Node.js LTS (v20)
      ansible.builtin.shell: |
        if ! command -v node &> /dev/null; then
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
        fi
      args:
        creates: /usr/bin/node

    - name: Criar diretório da aplicação
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Sincronizar arquivos do projeto
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/"
        dest: "{{ app_dir }}/"
        mode: 'preserve'

    - name: Subir containers Docker Compose
      ansible.builtin.shell: "docker compose up -d"
      args:
        chdir: "{{ app_dir }}"

    - name: Criar serviço Systemd para o Dashboard
      ansible.builtin.copy:
        dest: /etc/systemd/system/iopenbackup-dashboard.service
        content: |
          [Unit]
          Description=iOpenbackup Dashboard & Auth Proxy
          After=network.target docker.service

          [Service]
          Type=simple
          User=root
          WorkingDirectory={{ app_dir }}
          ExecStart=/usr/bin/node {{ app_dir }}/dashboard/server.js
          Restart=always
          RestartSec=5
          Environment=PORT={{ dashboard_port }}
          Environment=NODE_ENV=production

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Iniciar e habilitar o serviço do Dashboard
      ansible.builtin.systemd:
        name: iopenbackup-dashboard
        state: restarted
        daemon_reload: true
        enabled: true

    - name: Exibir mensagem de sucesso
      ansible.builtin.debug:
        msg: "iOpenbackup instalado com sucesso! Acesse http://{{ ansible_default_ipv4.address }}:{{ dashboard_port }}"
